{{-  if .Values.crds.enabled -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: models.kubeai.org
spec:
  group: kubeai.org
  names:
    kind: Model
    listKind: ModelList
    plural: models
    singular: model
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Model resources define the ML models that will be served by KubeAI.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpec defines the desired state of Model.
            properties:
              adapters:
                items:
                  properties:
                    name:
                      description: Name must be a lowercase string with no spaces.
                      maxLength: 63
                      pattern: ^[a-z0-9-]+$
                      type: string
                    url:
                      pattern: ^(hf|s3|gs|oss)://[a-zA-Z0-9][a-zA-Z0-9._:/-]*$
                      type: string
                      x-kubernetes-validations:
                      - message: adapter url must start with "hf://", "s3://", "gs://",
                          or "oss://".
                        rule: self.startsWith("hf://") || self.startsWith("s3://")
                          || self.startsWith("gs://") || self.startsWith("oss://")
                  required:
                  - name
                  - url
                  type: object
                type: array
              args:
                description: Args to be added to the server process.
                items:
                  type: string
                type: array
              autoscalingDisabled:
                description: |-
                  AutoscalingDisabled will stop the controller from managing the replicas
                  for the Model. When disabled, metrics will not be collected on server Pods.
                type: boolean
              cacheProfile:
                description: |-
                  CacheProfile to be used for caching model artifacts.
                  Must be a valid CacheProfile defined in the system config.
                type: string
                x-kubernetes-validations:
                - message: cacheProfile is immutable.
                  rule: self == oldSelf
              engine:
                description: Engine to be used for the server process.
                enum:
                - OLlama
                - VLLM
                - FasterWhisper
                - Infinity
                - SGLang
                - LlamaCpp
                type: string
              env:
                additionalProperties:
                  type: string
                description: Env variables to be added to the server process.
                type: object
              envFrom:
                description: Env variables to be added to the server process from
                  Secret or ConfigMap.
                items:
                  description: EnvFromSource represents the source of a set of ConfigMaps
                    or Secrets
                  properties:
                    configMapRef:
                      description: The ConfigMap to select from
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the ConfigMap must be defined
                          type: boolean
                      type: object
                      x-kubernetes-map-type: atomic
                    prefix:
                      description: |-
                        Optional text to prepend to the name of each environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    secretRef:
                      description: The Secret to select from
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret must be defined
                          type: boolean
                      type: object
                      x-kubernetes-map-type: atomic
                  type: object
                type: array
              features:
                description: |-
                  Features that the model supports.
                  Dictates the APIs that are available for the model.
                items:
                  enum:
                  - TextGeneration
                  - TextEmbedding
                  - Reranking
                  - SpeechToText
                  - SystemOne
                  - TextClassification
                  type: string
                type: array
              files:
                description: Files to be mounted in the model Pods.
                items:
                  description: File represents a file to be mounted in the model pod.
                  properties:
                    content:
                      description: |-
                        Content of the file to be mounted.
                        Will be injected into a ConfigMap and mounted in the model Pods.
                      maxLength: 100000
                      type: string
                    path:
                      description: |-
                        Path where the file should be mounted in the pod.
                        Must be an absolute path.
                      maxLength: 1024
                      type: string
                      x-kubernetes-validations:
                      - message: Path must be an absolute path, starting with /, and
                          must not contain a ':' character.
                        rule: self.startsWith('/') && !self.contains(':')
                  required:
                  - content
                  - path
                  type: object
                maxItems: 10
                type: array
              image:
                description: |-
                  Image to be used for the server process.
                  Will be set from ResourceProfile + Engine if not specified.
                type: string
              loadBalancing:
                default: {}
                description: |-
                  LoadBalancing configuration for the model.
                  If not specified, a default is used based on the engine and request.
                properties:
                  prefixHash:
                    default: {}
                    properties:
                      meanLoadFactor:
                        default: 125
                        description: |-
                          MeanLoadPercentage is the percentage that any given endpoint's load must not exceed
                          over the mean load of all endpoints in the hash ring. Defaults to 125% which is
                          a widely accepted value for the Consistent Hashing with Bounded Loads algorithm.
                        minimum: 100
                        type: integer
                      prefixCharLength:
                        default: 100
                        description: PrefixCharLength is the number of characters
                          to count when building the prefix to hash.
                        type: integer
                      replication:
                        default: 256
                        description: |-
                          Replication is the number of replicas of each endpoint on the hash ring.
                          Higher values will result in a more even distribution of load but will
                          decrease lookup performance.
                        type: integer
                        x-kubernetes-validations:
                        - message: replication is immutable.
                          rule: self == oldSelf
                    type: object
                  strategy:
                    default: LeastLoad
                    enum:
                    - LeastLoad
                    - PrefixHash
                    type: string
                type: object
              maxReplicas:
                description: |-
                  MaxReplicas is the maximum number of Pod replicas that the model can scale up to.
                  Empty value means no limit.
                format: int32
                minimum: 1
                type: integer
              minReplicas:
                description: |-
                  MinReplicas is the minimum number of Pod replicas that the model can scale down to.
                  Note: 0 is a valid value.
                format: int32
                minimum: 0
                type: integer
              owner:
                description: |-
                  Owner of the model. Used solely to populate the owner field in the
                  OpenAI /v1/models endpoint.
                  DEPRECATED.
                type: string
              priorityClassName:
                description: |-
                  PriorityClassName sets the priority class for all pods created for this model.
                  If specified, the PriorityClass must exist before the model is created.
                  This is useful for implementing priority and preemption for models.
                type: string
              replicas:
                description: |-
                  Replicas is the number of Pod replicas that should be actively
                  serving the model. KubeAI will manage this field unless AutoscalingDisabled
                  is set to true.
                format: int32
                type: integer
              resourceProfile:
                description: |-
                  ResourceProfile required to serve the model.
                  Use the format "<resource-profile-name>:<count>".
                  Example: "nvidia-gpu-l4:2" - 2x NVIDIA L4 GPUs.
                  Must be a valid ResourceProfile defined in the system config.
                type: string
              scaleDownDelaySeconds:
                default: 30
                description: |-
                  ScaleDownDelay is the minimum time before a deployment is scaled down after
                  the autoscaling algorithm determines that it should be scaled down.
                format: int64
                type: integer
              targetRequests:
                default: 100
                description: |-
                  TargetRequests is average number of active requests that the autoscaler
                  will try to maintain on model server Pods.
                format: int32
                minimum: 1
                type: integer
              url:
                description: |-
                  URL of the model to be served.
                  Currently the following formats are supported:

                  For VLLM, SGLang, FasterWhisper, Infinity engines:

                  "hf://<repo>/<model>"
                  "pvc://<pvcName>"
                  "pvc://<pvcName>/<pvcSubpath>"
                  "oci://<registry>/<repository>:<tag>"
                  "gs://<bucket>/<path>" (only with cacheProfile)
                  "oss://<bucket>/<path>" (only with cacheProfile)
                  "s3://<bucket>/<path>" (only with cacheProfile)

                  For the LlamaCpp engine:

                  "hf://<repo>/<model>"
                  "hf://<repo>/<model>:<quant>"
                  "pvc://<pvcName>/<pvcSubpath>?model=<file>.gguf"
                  "pvc://<pvcName>/<pvcSubpath>/<file>.gguf"
                  "oci://<registry>/<repository>:<tag>?model=<file>.gguf"

                  The "model" query parameter names the GGUF file inside the mounted
                  directory. It is required for "oci://" sources and for "pvc://" paths
                  that do not already name a .gguf file. A model split across shards has
                  to use it and keep every shard in the same directory, because llama.cpp
                  derives the sibling shard paths from the file name.

                  For OLlama engine:

                  "ollama://<model>"
                pattern: ^([a-z0-9]+):\/\/([a-zA-Z0-9._:/-]+)(\?.*)?$
                type: string
                x-kubernetes-validations:
                - message: url must start with "oci://", "hf://", "pvc://", "ollama://",
                    "s3://", "gs://", or "oss://" and not be empty.
                  rule: self.startsWith("oci://") || self.startsWith("hf://") || self.startsWith("pvc://")
                    || self.startsWith("ollama://") || self.startsWith("s3://") ||
                    self.startsWith("gs://") || self.startsWith("oss://")
            required:
            - engine
            - features
            - scaleDownDelaySeconds
            - targetRequests
            - url
            type: object
            x-kubernetes-validations:
            - message: cacheProfile is only supported with urls of format "hf://...",
                "s3://...", "gs://...", or "oss://..." at the moment.
              rule: '!has(self.cacheProfile) || self.url.startsWith("hf://") || self.url.startsWith("s3://")
                || self.url.startsWith("gs://") || self.url.startsWith("oss://")'
            - message: urls of format "gs://..." only supported when using a cacheProfile
              rule: '!self.url.startsWith("gs://") || has(self.cacheProfile)'
            - message: urls of format "oss://..." only supported when using a cacheProfile
              rule: '!self.url.startsWith("oss://") || has(self.cacheProfile)'
            - message: minReplicas should be less than or equal to maxReplicas.
              rule: '!has(self.maxReplicas) || self.minReplicas <= self.maxReplicas'
            - message: adapters only supported with VLLM engine.
              rule: '!has(self.adapters) || self.engine == "VLLM"'
            - message: the LlamaCpp engine only supports urls of format "hf://...",
                "pvc://...", or "oci://...".
              rule: self.engine != "LlamaCpp" || self.url.startsWith("hf://") || self.url.startsWith("pvc://")
                || self.url.startsWith("oci://")
            - message: cacheProfile is not supported with the LlamaCpp engine.
              rule: '!has(self.cacheProfile) || self.engine != "LlamaCpp"'
            - message: urls of format "ollama://..." are not supported with the SGLang
                engine.
              rule: self.engine != "SGLang" || !self.url.startsWith("ollama://")
            - message: url is immutable when using cacheProfile.
              rule: '!has(oldSelf.cacheProfile) || self.url == oldSelf.url'
            - message: All file paths must be unique.
              rule: '!has(self.files) || self.files.size() <= 1 || !self.files.exists(f,
                self.files.filter(other, other.path == f.path).size() > 1)'
          status:
            description: ModelStatus defines the observed state of Model.
            properties:
              cache:
                properties:
                  admission:
                    description: Admission explains the most recent admission decision
                      for this Model.
                    properties:
                      admitted:
                        description: Admitted is true when the entry may be downloaded.
                        type: boolean
                      at:
                        description: At is when the decision was made.
                        format: date-time
                        type: string
                      availableBytes:
                        description: AvailableBytes is the free budget at decision
                          time.
                        format: int64
                        type: integer
                      holders:
                        description: Holders names the Models or entries that occupy
                          the volume.
                        items:
                          type: string
                        type: array
                      reason:
                        description: Reason is a short human readable explanation.
                        type: string
                      reclaimed:
                        description: Reclaimed lists the entries that were reclaimed
                          to admit the entry.
                        items:
                          type: string
                        type: array
                      requiredBytes:
                        description: RequiredBytes is the size the new entry needs.
                        format: int64
                        type: integer
                      shortfallBytes:
                        description: ShortfallBytes is how much the entry exceeds
                          the available budget.
                        format: int64
                        type: integer
                      volume:
                        description: Volume is the volume the decision applies to.
                        type: string
                    required:
                    - admitted
                    - reason
                    type: object
                  entry:
                    description: |-
                      Entry describes the cache entry backing this Model. The entry key is
                      derived from the source identity and is shared by every Model that
                      references the same source version.
                    properties:
                      key:
                        description: Key is the stable, credential-free identifier
                          of the entry.
                        type: string
                      lastUsed:
                        description: LastUsed is the most recent time the entry was
                          referenced or served.
                        format: date-time
                        type: string
                      loadState:
                        description: LoadState is one of Pending, Loading, Ready,
                          Failed or Unknown.
                        type: string
                      reclaimable:
                        description: Reclaimable is true when no Model references
                          the entry and no Pod uses it.
                        type: boolean
                      referencedBy:
                        description: ReferencedBy is the number of Models that reference
                          the entry.
                        format: int32
                        type: integer
                      relPath:
                        description: RelPath is the entry directory relative to the
                          volume root.
                        type: string
                      sizeBytes:
                        description: SizeBytes is the measured or declared size of
                          the entry.
                        format: int64
                        type: integer
                      sizeKnown:
                        description: SizeKnown is false when the entry has never been
                          measured.
                        type: boolean
                      volume:
                        description: Volume is the name of the volume that holds the
                          entry.
                        type: string
                    required:
                    - key
                    - loadState
                    - reclaimable
                    - referencedBy
                    - sizeBytes
                    - sizeKnown
                    - volume
                    type: object
                  loaded:
                    description: |-
                      Loaded reports whether the cache entry for this Model has been fully
                      downloaded. It is never true for an interrupted or failed download.
                    type: boolean
                  placement:
                    description: Placement explains where replicas are (or should
                      be) placed.
                    properties:
                      entryKey:
                        description: EntryKey ties the placement conclusion to the
                          cache entry that supports it.
                        type: string
                      reason:
                        description: Reason is a short human readable explanation.
                        type: string
                      replicas:
                        description: Replicas contains one entry per existing replica
                          and one per replica to create.
                        items:
                          description: ModelPlacementReplicaStatus describes the placement
                            of one replica.
                          properties:
                            candidates:
                              description: Candidates is the deterministic preference
                                order for a replica to create.
                              items:
                                description: ModelPlacementCandidateStatus is one
                                  candidate node in preference order.
                                properties:
                                  node:
                                    description: Node is the candidate node name.
                                    type: string
                                  rank:
                                    description: Rank starts at 0 for the most preferred
                                      candidate.
                                    format: int32
                                    type: integer
                                  reason:
                                    description: Reason is a short human readable
                                      explanation of the preference.
                                    type: string
                                required:
                                - node
                                - rank
                                - reason
                                type: object
                              type: array
                            node:
                              description: Node is the node of an existing replica,
                                empty for a replica to create.
                              type: string
                            pod:
                              description: Pod is the name of an existing replica,
                                empty for a replica to create.
                              type: string
                            reason:
                              description: Reason is a short human readable explanation.
                              type: string
                          required:
                          - reason
                          type: object
                        type: array
                      valid:
                        description: Valid is false when the supporting entry is missing,
                          reclaimed or migrating.
                        type: boolean
                      volume:
                        description: Volume ties the placement conclusion to the cache
                          volume.
                        type: string
                    required:
                    - reason
                    - valid
                    type: object
                  volume:
                    description: Volume describes the cache volume ledger as observed
                      for this Model.
                    properties:
                      budgetBytes:
                        description: BudgetBytes is the capacity declared by the volume.
                        format: int64
                        type: integer
                      entries:
                        description: Entries lists the entries known on the volume.
                        items:
                          description: ModelCacheEntryStatus describes a single cache
                            entry on a cache volume.
                          properties:
                            key:
                              description: Key is the stable, credential-free identifier
                                of the entry.
                              type: string
                            lastUsed:
                              description: LastUsed is the most recent time the entry
                                was referenced or served.
                              format: date-time
                              type: string
                            loadState:
                              description: LoadState is one of Pending, Loading, Ready,
                                Failed or Unknown.
                              type: string
                            reclaimable:
                              description: Reclaimable is true when no Model references
                                the entry and no Pod uses it.
                              type: boolean
                            referencedBy:
                              description: ReferencedBy is the number of Models that
                                reference the entry.
                              format: int32
                              type: integer
                            relPath:
                              description: RelPath is the entry directory relative
                                to the volume root.
                              type: string
                            sizeBytes:
                              description: SizeBytes is the measured or declared size
                                of the entry.
                              format: int64
                              type: integer
                            sizeKnown:
                              description: SizeKnown is false when the entry has never
                                been measured.
                              type: boolean
                            volume:
                              description: Volume is the name of the volume that holds
                                the entry.
                              type: string
                          required:
                          - key
                          - loadState
                          - reclaimable
                          - referencedBy
                          - sizeBytes
                          - sizeKnown
                          - volume
                          type: object
                        type: array
                      name:
                        description: Name is the name of the PersistentVolumeClaim
                          backing the volume.
                        type: string
                      pendingBytes:
                        description: PendingBytes is the sum of active load reservations.
                        format: int64
                        type: integer
                      recentReclaims:
                        description: RecentReclaims lists the most recent capacity
                          reclaims in order.
                        items:
                          description: ModelCacheReclaimStatus describes one capacity
                            reclaim.
                          properties:
                            at:
                              description: At is when the reclaim was decided.
                              format: date-time
                              type: string
                            entryKey:
                              description: EntryKey is the reclaimed entry.
                              type: string
                            reason:
                              description: Reason is a short human readable explanation.
                              type: string
                            sizeBytes:
                              description: SizeBytes is the size that was freed.
                              format: int64
                              type: integer
                          required:
                          - at
                          - entryKey
                          - reason
                          - sizeBytes
                          type: object
                        type: array
                      recentRejections:
                        description: RecentRejections lists the most recent admission
                          rejections in order.
                        items:
                          description: ModelCacheRejectionStatus describes one admission
                            rejection.
                          properties:
                            at:
                              description: At is when the rejection was decided.
                              format: date-time
                              type: string
                            availableBytes:
                              description: AvailableBytes is the free budget at decision
                                time.
                              format: int64
                              type: integer
                            entryKey:
                              description: EntryKey is the entry that was rejected.
                              type: string
                            reason:
                              description: Reason is a short human readable explanation.
                              type: string
                            requiredBytes:
                              description: RequiredBytes is the size the entry needed.
                              format: int64
                              type: integer
                            shortfallBytes:
                              description: ShortfallBytes is how much the entry exceeded
                                the available budget.
                              format: int64
                              type: integer
                          required:
                          - at
                          - availableBytes
                          - entryKey
                          - reason
                          - requiredBytes
                          - shortfallBytes
                          type: object
                        type: array
                      reclaimableBytes:
                        description: ReclaimableBytes is the sum of reclaimable entry
                          sizes.
                        format: int64
                        type: integer
                      usedBytes:
                        description: UsedBytes is the sum of known entry sizes.
                        format: int64
                        type: integer
                    required:
                    - budgetBytes
                    - name
                    - pendingBytes
                    - reclaimableBytes
                    - usedBytes
                    type: object
                required:
                - loaded
                type: object
              replicas:
                properties:
                  all:
                    format: int32
                    type: integer
                  ready:
                    format: int32
                    type: integer
                required:
                - all
                - ready
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must not exceed 40 characters.
          rule: size(self.metadata.name) <= 40
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas.all
      status: {}
{{-  end }}
